<script>
// ── Fundament: hier nichts ändern ────────────────────────────────────────
const W = 640, H = 400;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
(function hiDpi(){ const d = Math.max(1, window.devicePixelRatio || 1); cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); })();
const COL = {ink:'#1f2430', muted:'#5b6472', line:'#e4e2dc', red:'#c8102e', teal:'#0e7490', violet:'#5b4a9e', ok:'#166534', wall:'#3b4252', floor:'#f4efe4', earth:'#8a7356', grass:'#7aa35a', grid:'#efede8'};

// ── Zufall mit Seed ──
// mulberry32(seed) liefert einen Zufallsgenerator r. Jeder Aufruf r() gibt die
// nächste Zahl von 0 bis unter 1. Gleicher Seed, gleiche Folge.
function mulberry32(seed){ let a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function zufallsZahl(r, a, b){ return a + Math.floor(r() * (b - a + 1)); }   // ganze Zahl von a bis b

// ── Raster ──
function neuesRaster(breite, hoehe, wert){ return Array.from({length: hoehe}, () => Array(breite).fill(wert)); }
function kopie(k){ return k.map(z => z.slice()); }
function gleich(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
function bodenfelder(k){ let n = 0; k.forEach(z => z.forEach(v => { if (v === 0) n++; })); return n; }
// Wie viele der 8 Nachbarn sind Wand? Ausserhalb der Karte zählt als Wand.
function waendeRingsum(karte, x, y){ let n = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const yy = y + dy, xx = x + dx; if (yy < 0 || xx < 0 || yy >= karte.length || xx >= karte[0].length || karte[yy][xx] === 1) n++; } return n; }
// Flutfüllung (Breitensuche aus Block 3): alle Felder, die vom Start aus über Boden erreichbar sind
function flut(k, sx, sy){ const seen = neuesRaster(k[0].length, k.length, false); if (k[sy][sx] === 1) return seen; const q = [[sx, sy]]; seen[sy][sx] = true; while (q.length) { const [x, y] = q.shift(); for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && ny < k.length && nx < k[0].length && k[ny][nx] !== 1 && !seen[ny][nx]) { seen[ny][nx] = true; q.push([nx, ny]); } } } return seen; }
function erreichbar(karte, start, ziel){ return flut(karte, start.x, start.y)[ziel.y][ziel.x]; }
// Länge des kürzesten Wegs in Schritten, -1 wenn es keinen gibt
function weglaenge(karte, start, ziel){ const k = karte, d = neuesRaster(k[0].length, k.length, -1); if (k[start.y][start.x] === 1) return -1; d[start.y][start.x] = 0; const q = [[start.x, start.y]]; while (q.length) { const [x, y] = q.shift(); if (x === ziel.x && y === ziel.y) return d[y][x]; for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && ny < k.length && nx < k[0].length && k[ny][nx] !== 1 && d[ny][nx] < 0) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); } } } return -1; }
function wegZellen(karte, start, ziel){ const k = karte, von = new Map(), key = (x, y) => x + ',' + y; von.set(key(start.x, start.y), null); const q = [[start.x, start.y]]; while (q.length) { const [x, y] = q.shift(); if (x === ziel.x && y === ziel.y) { const w = []; let c = key(x, y); while (c) { w.push(c.split(',').map(Number)); c = von.get(c); } return w.reverse(); } for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && ny < k.length && nx < k[0].length && k[ny][nx] !== 1 && !von.has(key(nx, ny))) { von.set(key(nx, ny), key(x, y)); q.push([nx, ny]); } } } return []; }

// ── Referenzen für den Prüfstand und für hoehle ──
function _baueStrecke(seed){ const r = mulberry32(seed), h = [3]; for (let c = 1; c < 24; c++) h.push(Math.max(1, Math.min(7, h[c - 1] + zufallsZahl(r, -1, 1)))); return h; }
function _glaetten(k){ const n = kopie(k); for (let y = 0; y < k.length; y++) for (let x = 0; x < k[0].length; x++) n[y][x] = waendeRingsum(k, x, y) >= 5 ? 1 : 0; return n; }

// ── 4.2 Gegner ──
const GEGNER = [{name: 'Schleim', kosten: 2}, {name: 'Fledermaus', kosten: 3}, {name: 'Ritter', kosten: 5}];
function kosten(liste){ return liste.reduce((s, n) => s + ((GEGNER.find(g => g.name === n) || {kosten: 0}).kosten), 0); }

// ── 4.5 Höhlen ──
const HB = 40, HH = 24, MIN_WEG = 40;
// hoehle(seed): zellulärer Automat mit 55 Prozent Wänden und vier Durchgängen.
// Start ist der Boden nahe der Mitte links, Ziel der Boden nahe der Mitte rechts.
function hoehle(seed){
  const r = mulberry32(seed); let k = neuesRaster(HB, HH, 1);
  for (let y = 1; y < HH - 1; y++) for (let x = 1; x < HB - 1; x++) k[y][x] = r() < 0.55 ? 1 : 0;
  for (let i = 0; i < 4; i++) k = _glaetten(k);
  const naechster = (zx, zy) => { let best = null, bd = 1e9; for (let y = 1; y < HH - 1; y++) for (let x = 1; x < HB - 1; x++) if (!k[y][x]) { const d = Math.abs(x - zx) + Math.abs(y - zy); if (d < bd) { bd = d; best = {x, y}; } } return best; };
  return {karte: k, start: naechster(2, HH >> 1), ziel: naechster(HB - 3, HH >> 1)};
}
function _spielbare(startSeed){ for (let s = startSeed; s < startSeed + 1000; s++) { const h = hoehle(s); if (erreichbar(h.karte, h.start, h.ziel) && weglaenge(h.karte, h.start, h.ziel) >= MIN_WEG) return s; } return null; }

// ── 4.6 Ein Punkt sucht seinen Weg ──
const EB = 20, EH = 14, GENE = 40, POP = 30, START6 = {x: 1, y: 12}, ZIEL6 = {x: 18, y: 1};
const RICHTUNG = [[0, -1], [1, 0], [0, 1], [-1, 0]];   // 0 hoch, 1 rechts, 2 runter, 3 links
function wand6(x, y){ return x < 0 || y < 0 || x >= EB || y >= EH || (x === 10 && y >= 4); }
function laufe(genom){ let x = START6.x, y = START6.y; const weg = [[x, y]]; for (let i = 0; i < genom.length; i++) { const d = RICHTUNG[genom[i]]; if (!d) continue; if (!wand6(x + d[0], y + d[1])) { x += d[0]; y += d[1]; } weg.push([x, y]); if (x === ZIEL6.x && y === ZIEL6.y) return {weg, angekommen: true, schritte: i + 1}; } return {weg, angekommen: false, schritte: genom.length}; }
// Fitness wie auf den Folien: 1 / (1 + Abstand zum Ziel), wer das Ziel erreicht, bekommt 2
function fitnessWeg(genom){ const l = laufe(genom), [x, y] = l.weg[l.weg.length - 1]; return l.angekommen ? 2 : 1 / (1 + Math.hypot(x - ZIEL6.x, y - ZIEL6.y)); }
// Turnierselektion: drei zufällig ziehen, der beste gewinnt
function turnier(pop, fit, r){ let best = -1; for (let i = 0; i < 3; i++) { const j = Math.floor(r() * pop.length); if (best < 0 || fit[j] > fit[best]) best = j; } return pop[best]; }
function zufallsGenom(r){ return Array.from({length: GENE}, () => Math.floor(r() * 4)); }

  const fit = pop.map(fitnessWeg), idx = pop.map((_, i) => i).sort((a, b) => fit[b] - fit[a]);
  const neu = [pop[idx[0]].slice(), pop[idx[1]].slice()];                 // Elitismus: die zwei besten bleiben
  while (neu.length < POP) neu.push(mutieren(kreuzen(turnier(pop, fit, r), turnier(pop, fit, r), r), 0.05, r) || []);
  return {neu, fit, besteFitness: fit[idx[0]], bester: pop[idx[0]]};
}
function evolution6(seed, gens){ const r = mulberry32(seed); let pop = Array.from({length: POP}, () => zufallsGenom(r)); for (let g = 0; g < gens; g++) pop = generation6(pop, r).neu; const fit = pop.map(fitnessWeg); let b = 0; fit.forEach((f, i) => { if (f > fit[b]) b = i; }); return {bester: pop[b], fitness: fit[b]}; }

// ── 4.7 Ein Läufer lernt springen ──
const LX = 80, LB = 24, LH = 36, TEMPO = 260, GRAV = 2000, SPRUNG = 640, DT = 1 / 60, ANZ_HIND = 30, BODEN = 330;
function strecke(seed){ const r = mulberry32(seed), h = []; let x = 420; for (let i = 0; i < ANZ_HIND; i++) { const hoch = r() < 0.5; h.push({x, w: hoch ? 22 : 30, h: hoch ? 70 : 30}); x += 170 + Math.floor(r() * 220); } return h; }
// Das Gehirn: 2 Eingänge und ein fester Eingang 1 (Bias) → 4 versteckte Neuronen (tanh) → 1 Ausgang.
// 3 · 4 + 4 + 1 = 17 Gewichte. Ausgang grösser als 0 heisst: springen.
function denke(gewichte, abstand, hoehe){ const ein = [abstand, hoehe, 1], ver = [];
  for (let j = 0; j < 4; j++) { let s = 0; for (let i = 0; i < 3; i++) s += ein[i] * gewichte[j * 3 + i]; ver.push(Math.tanh(s)); }
  let o = gewichte[16]; for (let j = 0; j < 4; j++) o += ver[j] * gewichte[12 + j]; return o; }

  const L = {strecke: 0, spruenge: 0, hindernisse: 0, lebt: true, y: 0, vy: 0};
  for (let t = 0; t < 3600 && L.lebt; t++) {
    const naechstes = hind.find(o => o.x + o.w - L.strecke > LX); if (!naechstes) break;
    const abstand = Math.min(1, (naechstes.x - L.strecke - (LX + LB)) / 300), hoehe = naechstes.h / 70;
    if (L.y === 0 && denke(gewichte, abstand, hoehe) > 0) { L.vy = SPRUNG; L.spruenge++; }
    L.vy -= GRAV * DT; L.y = Math.max(0, L.y + L.vy * DT); if (L.y === 0) L.vy = 0;
    L.strecke += TEMPO * DT;
    for (const o of hind) { const ox = o.x - L.strecke; if (ox < LX + LB && ox + o.w > LX && L.y < o.h) { L.lebt = false; break; } }
    L.hindernisse = hind.filter(o => o.x + o.w - L.strecke < LX).length;
    if (protokoll) protokoll.push({y: L.y, s: L.strecke, lebt: L.lebt});
  }
  return L;
}
function mutiereGewichte(g, r){ return g.map(w => r() < 0.2 ? w + (r() + r() + r() - 1.5) * 0.8 : w); }   // kleine Zufallswerte addieren

// ── Ablauf ──────────────────────────────────────────────────────────────
const ORDER = ['4.1', '4.2', '4.3', '4.4', '4.5', '4.6', '4.7'];
let cur = null, last = performance.now();
const nav = document.getElementById('nav');
ORDER.forEach(k => { const b = document.createElement('button'); b.textContent = S[k].title.split(' · ')[0] + ' ' + S[k].title.split(' · ')[1]; b.onclick = () => select(k); b.id = 'b' + k; nav.appendChild(b); });
function runTests(k){ return S[k].tests().map(([n, f]) => { try { const [ok, why] = f(); return {n, ok: !!ok, why}; } catch (e) { return {n, ok: false, why: 'Ihr Code hat einen Fehler geworfen: ' + e.message}; } }); }
function select(k){
  cur = k; location.hash = k;
  ORDER.forEach(o => document.getElementById('b' + o).classList.toggle('on', o === k));
  const g = GUIDE[k];
  document.getElementById('eyebrow').textContent = g.eb;
  document.getElementById('sceneTitle').textContent = S[k].title.split(' · ')[1];
  document.getElementById('sceneGoal').innerHTML = g.goal;
  document.getElementById('steps').innerHTML = g.steps.map(st => '<li><b>' + st[0] + '</b>' + st[1] + '</li>').join('');
  document.getElementById('info').innerHTML = '<b>Bedienung:</b> ' + S[k].text;
  const ix = ORDER.indexOf(k);
  document.getElementById('prev').disabled = ix === 0; document.getElementById('next').disabled = ix === ORDER.length - 1;
  live = {t: 99, pass: 0, total: 0};
  ctl('');
  document.getElementById('results').innerHTML = '';
  S[k].err = '';
  try { S[k].init(); } catch (e) { S[k].err = e.message; }
}
document.getElementById('prev').onclick = () => { const i = ORDER.indexOf(cur); if (i > 0) select(ORDER[i - 1]); };
document.getElementById('next').onclick = () => { const i = ORDER.indexOf(cur); if (i < ORDER.length - 1) select(ORDER[i + 1]); };
// Live-Anzeige: die Prüfungen laufen still im Hintergrund
let live = {t: 99, pass: 0, total: 0};
function liveCheck(dt){ live.t += dt; if (live.t < 0.8) return; live.t = 0; const l = runTests(cur); live.pass = l.filter(x => x.ok).length; live.total = l.length; }
function drawLive(){
  const all = live.total && live.pass === live.total, s = 'Ihr Code: ' + live.pass + ' von ' + live.total + ' Prüfungen';
  ctx.font = '700 13px system-ui, sans-serif'; const w = ctx.measureText(s).width + 20;
  ctx.fillStyle = all ? '#166534' : '#c8102e'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(W - w - 8, H - 32, w, 24, 12) : ctx.rect(W - w - 8, H - 32, w, 24); ctx.fill();
  txt(s, W - w / 2 - 8, H - 20, {align: 'center', color: '#fff', size: 13, weight: 700});
}
document.getElementById('check').onclick = () => {
  const box = document.getElementById('results'); box.innerHTML = '';
  const list = runTests(cur), passed = list.filter(t => t.ok).length;
  const head = document.createElement('div'); head.className = passed === list.length ? 'ok' : 'no';
  head.innerHTML = '<b>' + passed + ' von ' + list.length + ' Prüfungen bestanden</b>'; box.appendChild(head);
  list.forEach(t => { const d = document.createElement('details'); d.className = t.ok ? 'ok' : 'no'; d.open = !t.ok;
    d.innerHTML = '<summary>' + (t.ok ? '✓ ' : '✗ ') + t.n + '</summary><span class="why">' + t.why + '</span>'; box.appendChild(d); });
};
// Gesamtübersicht für alle Aufgaben (oben)
function gesamt(){ let p = 0, n = 0; const teile = ORDER.map(k => { const l = runTests(k), a = l.filter(t => t.ok).length; p += a; n += l.length; return k + ': ' + a + '/' + l.length; }); document.getElementById('summe').textContent = p + ' von ' + n + ' Prüfungen bestanden · ' + teile.join(' · '); }
function frame(now){
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  const s = S[cur];
  ctx.clearRect(0, 0, W, H);
  try { if (!s.err) s.step(dt); } catch (e) { s.err = e.message; }
  try { s.draw(); } catch (e) { s.err = s.err || e.message; }
  liveCheck(dt); drawLive();
  if (s.err) { ctx.fillStyle = 'rgba(253,241,242,.95)'; ctx.fillRect(10, H - 76, W - 20, 36); txt('Fehler in Ihrem Code: ' + s.err, 20, H - 58, {color: COL.red, size: 13}); }
  requestAnimationFrame(frame);
}
select(ORDER.includes(location.hash.slice(1)) ? location.hash.slice(1) : '4.1');
