<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fulgur Dungeon</title>
<link rel="stylesheet" href="index.css">
<style>
  body{margin:0;background:#1f2430;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;
    font-family:sans-serif;color:#e6e6e6}
  canvas {
  display: block;
  width: auto;
  max-width: 100%;
  height: auto;
  image-rendering: pixelated;
  touch-action: none;
  }
  p{font-size:13px;color:#8a939f}
</style>
</head>
<body>
  <h1>Fulgur Dungeon </h1>
  <input id="seed" inputmode="numeric" maxlength="6" placeholder="Seed (leer = Zufall)" oninput="this.value = this.value.replace(/\D/g, '')">
  <canvas id="game" width="1024" height="576"></canvas>
  <p>Pfeile oder WASD: laufen · Shift: Rolle · Leertaste: Schwert · F: Blitz · Enter: Start · R oder Enter: Neustart · ESC: Pause · O: Overlay · P: Partikel</p>
  <script src="game.js"></script>
  <script src="world.js"></script>
  <script src="mapgen.js"></script>
  <script src="sprites.js"></script>
  <script src="combat.js"></script>
  <script src="enemy.js"></script>
  <script src="hud.js"></script>
  <script src="effects.js"></script>
</body>
</html>
