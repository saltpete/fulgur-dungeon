<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Fulgur Dungeon</title>
<link rel="stylesheet" href="index.css">
<style>
  body{margin:0;background:#1f2430;display:flex;flex-direction:column;
    align-items:center;justify-content:center;min-height:100vh;
    font-family:sans-serif;color:#e6e6e6}
  canvas {
  display: block;
  width: 100%;
  max-width: 768px;
  height: auto;
  image-rendering: pixelated;
  touch-action: none;
  }
  p{font-size:13px;color:#8a939f}
</style>
</head>
<body>
  <h1>Fulgur Dungeon </h1>
  <canvas id="game" width="768" height="432"></canvas>

  <div id="dpad">
  <button data-dir="up">▲</button>
  <button data-dir="left">◀</button>
  <button data-dir="right">▶</button>
  <button data-dir="down">▼</button>
</div>
  <script src="game.js"></script>
</body>
</html>
